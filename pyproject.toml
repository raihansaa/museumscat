[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "museumscat"
version = "1.0.0"
description = "Reading the date and locality off handwritten museum specimen labels, and knowing which readings to trust"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Only needed to run the cropper and the readers over real images.
images = ["opencv-python>=4.8", "Pillow>=10.0"]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["museumscat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
